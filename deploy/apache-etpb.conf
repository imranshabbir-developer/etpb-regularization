# =====================================================================
# ETPB — Regularization of Possession
# Apache mapping for XAMPP.
#
# Included from httpd.conf.
#
# The application is served from its own port rather than as an alias under
# htdocs, so that DocumentRoot points at back-end/public. Application code,
# uploaded evidence of possession and the .env file then sit outside the
# document root and cannot be fetched over HTTP at all — which matters here,
# because .env carries the database password and storage/uploads holds
# certified copies of Jamabandi, mutations and CNICs.
#
#   http://localhost:8080
#
# Serving it as /etpb under the existing docroot was tried and rejected: it
# forces a RewriteBase into the application's own .htaccess, which then breaks
# whenever the mount point changes.
# =====================================================================

Listen 8080

<VirtualHost *:8080>
    ServerName etpb.localhost
    ServerAdmin admin@etpb.gov.pk

    DocumentRoot "C:/xampp/htdocs/proj_regular/back-end/public"

    <Directory "C:/xampp/htdocs/proj_regular/back-end/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Do not advertise the stack.
    ServerSignature Off

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset X-Powered-By
    </IfModule>

    ErrorLog  "C:/xampp/apache/logs/etpb-error.log"
    CustomLog "C:/xampp/apache/logs/etpb-access.log" combined
</VirtualHost>

# The junction back-end/public/assets -> front-end/assets is followed, so the
# stylesheet and images edited in front-end/ are served directly.
<Directory "C:/xampp/htdocs/proj_regular/front-end/assets">
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>
